<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边缘节点运维台</title>
<style>
:root {
    --bg-deep: #0f172a;
    --bg-card: #1e293b;
    --bg-hover: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --accent: #38bdf8;
    --success: #22c55e;
    --warning: #eab308;
    --danger: #ef4444;
    --font-sys: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --focus-ring: 0 0 0 2px #fff, 0 0 0 4px var(--accent);
}
@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
* { box-sizing: border-box; outline-offset: 2px; }
body { margin: 0; background: var(--bg-deep); color: var(--text-main); font-family: var(--font-sys); line-height: 1.5; }
.app-container { max-width: 1440px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; height: 100vh; }
.header-section { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--border); }
.filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
select, button { background: var(--bg-deep); color: var(--text-main); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; }
select:focus, button:focus { outline: var(--focus-ring); }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.table-wrapper { flex: 1; overflow: auto; background: var(--bg-card); border-radius: 0.5rem; border: 1px solid var(--border); position: relative; }
table { width: 100%; border-collapse: collapse; min-width: 800px; }
th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { background: var(--bg-deep); position: sticky; top: 0; z-index: 10; font-weight: 600; color: var(--text-muted); cursor: pointer; user-select: none; }
th:hover { color: var(--text-main); }
th span { display: inline-block; margin-right: 0.25rem; }
tr { transition: background 0.2s; }
tr:hover { background: var(--bg-hover); }
tr:focus-within { background: var(--bg-hover); }
.status-dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; margin-right: 0.5rem; }
.status-ok { background: var(--success); box-shadow: 0 0 4px var(--success); }
.status-warn { background: var(--warning); box-shadow: 0 0 4px var(--warning); }
.status-err { background: var(--danger); box-shadow: 0 0 4px var(--danger); }
.alert-badge { background: var(--danger); color: #fff; padding: 0.125rem 0.5rem; border-radius: 99px; font-size: 0.75rem; font-weight: bold; }
.card-list { display: none; }
@media (max-width: 600px) {
    .table-wrapper { display: none; }
    .card-list { display: flex; flex-direction: column; gap: 1rem; }
    .node-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .card-info { flex: 1; }
    .card-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .card-actions button { padding: 0.25rem 0.75rem; font-size: 0.75rem; }
}
.drawer { position: fixed; top: 0; right: -100%; width: 400px; height: 100%; background: var(--bg-card); border-left: 1px solid var(--border); box-shadow: -4px 0 15px rgba(0,0,0,0.5); z-index: 50; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
.drawer.open { right: 0; }
.drawer-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.drawer-body { padding: 1rem; overflow-y: auto; flex: 1; }
.drawer-footer { padding: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.5rem; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.stat-item { background: var(--bg-deep); padding: 0.75rem; border-radius: 0.375rem; border: 1px solid var(--border); }
.stat-label { color: var(--text-muted); font-size: 0.75rem; display: block; margin-bottom: 0.25rem; }
.stat-value { font-size: 1.125rem; font-weight: 600; }
.chart-placeholder { height: 150px; background: var(--bg-deep); border: 1px dashed var(--border); border-radius: 0.375rem; margin: 1rem 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.875rem; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 60; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal { background: var(--bg-card); width: 90%; max-width: 400px; padding: 1.5rem; border-radius: 0.5rem; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.modal h3 { margin-top: 0; }
.modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem; }
.close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.25rem; padding: 0; line-height: 1; }
.close-btn:hover { color: var(--text-main); }
@media (max-width: 600px) { .drawer { width: 100%; } }

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}th[tabindex]{cursor:pointer}
</style>
</head>
<body>
<div class="app-container">
    <header class="header-section">
        <div>
            <h1 style="margin:0 0 0.5rem 0; font-size:1.25rem;">边缘节点运维台</h1>
            <div class="filter-group">
                <select id="statusFilter" aria-label="状态筛选">
                    <option value="all">全部状态</option>
                    <option value="running">运行中</option>
                    <option value="warning">警告</option>
                    <option value="offline">离线</option>
                </select>
                <select id="regionFilter" aria-label="区域筛选">
                    <option value="all">全部区域</option>
                    <option value="cn-shanghai">华东</option>
                    <option value="cn-beijing">华北</option>
                    <option value="us-west">美西</option>
                </select>
                <button onclick="resetFilters()" style="margin-left:auto;">重置</button>
            </div>
        </div>
        <div style="display:flex; gap:0.5rem;">
            <button class="btn-primary" onclick="refreshData()">刷新数据</button>
            <button onclick="openDrawer()">添加节点</button>
        </div>
    </header>

    <div class="table-wrapper" role="region" aria-label="节点列表">
        <table id="nodeTable">
            <thead>
                <tr>
                    <th onclick="sortTable('id')" tabindex="0">节点 ID <span>↕</span></th>
                    <th onclick="sortTable('region')" tabindex="0">区域 <span>↕</span></th>
                    <th onclick="sortTable('status')" tabindex="0">状态 <span>↕</span></th>
                    <th onclick="sortTable('cpu')" tabindex="0">CPU <span>↕</span></th>
                    <th onclick="sortTable('memory')" tabindex="0">内存 <span>↕</span></th>
                    <th onclick="sortTable('alerts')" tabindex="0">告警 <span>↕</span></th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- JS Generated Rows -->
            </tbody>
        </table>
    </div>

    <div class="card-list" id="cardList">
        <!-- JS Generated Cards -->
    </div>
</div>

<div class="drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-header">
        <h2 id="drawerTitle">节点详情</h2>
        <button class="close-btn" onclick="closeDrawer()" aria-label="关闭详情">&times;</button>
    </div>
    <div class="drawer-body">
        <div class="stat-grid">
            <div class="stat-item">
                <span class="stat-label">运行时间</span>
                <span class="stat-value" id="detailUptime">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">负载</span>
                <span class="stat-value" id="detailLoad">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">网络流入</span>
                <span class="stat-value" id="detailNetIn">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">网络流出</span>
                <span class="stat-value" id="detailNetOut">--</span>
            </div>
        </div>
        <div class="chart-placeholder">
            [实时流量监控图表占位符]
        </div>
        <h3>最近告警</h3>
        <ul id="detailAlerts" style="padding-left:1.2rem; color:var(--text-muted);"></ul>
    </div>
    <div class="drawer-footer">
        <button class="btn-danger" onclick="confirmAlertAction()">确认告警</button>
        <button class="btn-primary" onclick="closeDrawer()">关闭</button>
    </div>
</div>

<div class="modal-overlay" id="alertModal">
    <div class="modal">
        <h3>确认告警</h3>
        <p>您确定要确认节点 <strong id="modalNodeId"></strong<strong></strong>的告警吗？
        </p>
        <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem;">
            <button class="btn-secondary" onclick="closeAlertModal()" style="padding:0.5rem 1rem;">取消</button>
            <button class="btn-danger" onclick="submitAlertConfirm()" style="padding:0.5rem 1rem;">确认</button>
        </div>
    </div>
</div>

<footer style="padding:1rem; text-align:center; color:var(--text-muted); font-size:0.85rem;">
    &copy; 2024 Edge Node Ops Platform. All rights reserved.
</footer>

<script>
    // State
    let currentSort = { key: 'id', dir: 'asc' };
    let currentAlertNodeId = null;

    // Mock Data Generation
    function generateMockData() {
        const regions = ['华东', '华北', '美西'];
        const statuses = ['运行中', '警告', '离线'];
        const data = [];
        for (let i = 1; i <= 50; i++) {
            data.push({
                id: `node-${String(i).padStart(4, '0')}`,
                region: regions[Math.floor(Math.random() * regions.length)],
                status: statuses[Math.floor(Math.random() * statuses.length)],
                cpu: Math.floor(Math.random() * 100),
                memory: Math.floor(Math.random() * 100),
                alerts: Math.random() > 0.8 ? Math.floor(Math.random() * 5) : 0
            });
        }
        return data;
    }

    // Render Table
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const cardList = document.getElementById('cardList');
        tbody.innerHTML = '';
        cardList.innerHTML = '';

        data.forEach(row => {
            // Table Row
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.id}</td>
                <td>${row.region}</td>
                <td><span class="status-badge ${row.status === '运行中' ? 'status-ok' : (row.status === '警告' ? 'status-warn' : 'status-off')}">${row.status}</span></td>
                <td>${row.cpu}%</td>
                <td>${row.memory}%</td>
                <td style="color:${row.alerts > 0 ? 'var(--danger)' : 'inherit'}">${row.alerts}</td>
                <td><button class="btn-link" onclick="openDrawer('${row.id}')">详情</button></td>
            `;
            tbody.appendChild(tr);

            // Card Row (Mobile)
            const card = document.createElement('div');
            card.className = 'node-card';
            card.innerHTML = `
                <div class="card-header">
                    <strong>${row.id}</strong>
                    <span>${row.region}</span>
                </div>
                <div class="card-body">
                    <div class="stat-row"><span>CPU:</span> <strong>${row.cpu}%</strong></div>
                    <div class="stat-row"><span>内存:</span> <strong>${row.memory}%</strong></div>
                    <div class="stat-row"><span>状态:</span> <span class="status-badge ${row.status === '运行中' ? 'status-ok' : (row.status === '警告' ? 'status-warn' : 'status-off')}">${row.status}</span></div>
                </div>
                <div class="card-footer">
                    <button class="btn-link" onclick="openDrawer('${row.id}')">查看详情</button>
                </div>
            `;
            cardList.appendChild(card);
        });
    }

    // Sorting
    function sortTable(key) {
        if (currentSort.key === key) {
            currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.key = key;
            currentSort.dir = 'asc';
        }
        const data = generateMockData(); // In real app, sort existing data
        data.sort((a, b) => {
            if (a[key] < b[key]) return currentSort.dir === 'asc' ? -1 : 1;
            if (a[key] > b[key]) return currentSort.dir === 'asc' ? 1 : -1;
            return 0;
        });
        renderTable(data);
    }

    // Drawer Logic
    function openDrawer(id) {
        const drawer = document.getElementById('detailDrawer');
        document.getElementById('detailUptime').innerText = '14 days';
        document.getElementById('detailLoad').innerText = '0.8';
        document.getElementById('detailNetIn').innerText = '1.2 GB/s';
        document.getElementById('detailNetOut').innerText = '0.9 GB/s';
        document.getElementById('detailAlerts').innerHTML = '<li>CPU usage spike detected</li><li>High latency to DB</li>';
        drawer.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
        document.getElementById('detailDrawer').classList.remove('open');
        document.body.style.overflow = 'auto';
    }

    // Alert Modal Logic
    function confirmAlertAction() {
        const nodeId = 'node-0001'; // Mock ID
        document.getElementById('modalNodeId').innerText = nodeId;
        document.getElementById('alertModal').classList.add('active');
    }

    function closeAlertModal() {
        document.getElementById('alertModal').classList.remove('active');
    }

    function submitAlertConfirm() {
        alert('告警已确认');
        closeAlertModal();
        closeDrawer();
    }

    function refreshData() {
        const data = generateMockData();
        renderTable(data);
    }

    function resetFilters() {
        document.getElementById('regionFilter').value = 'all';
        document.getElementById('statusFilter').value = 'all';
        refreshData();
    }

    function applyFilters() {
        const status = document.getElementById('statusFilter').value;
        const region = document.getElementById('regionFilter').value;
        const data = generateMockData().filter(n =>
            (status === 'all' || ({'运行中':'running','警告':'warning','离线':'offline'}[n.status] === status)) &&
            (region === 'all' || ({'华东':'cn-shanghai','华北':'cn-beijing','美西':'us-west'}[n.region] === region))
        );
        renderTable(data);
        document.getElementById('announce').textContent = `已显示 ${data.length} 个节点`;
    }

    document.getElementById('statusFilter').addEventListener('change', applyFilters);
    document.getElementById('regionFilter').addEventListener('change', applyFilters);
    document.querySelectorAll('th[tabindex]').forEach(th => th.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); th.click(); }
    }));
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeAlertModal(); closeDrawer(); }
    });
    document.querySelector('.app-container').insertAdjacentHTML('afterend','<div id="announce" role="status" aria-live="polite" class="sr-only"></div>');
    refreshData();
</script>
</body>
</html>
